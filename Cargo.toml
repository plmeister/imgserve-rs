[package]
name = "imgserve"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1.47", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.10"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif", "bmp", "tiff", "avif", "ico"] }
libflate = "2.1"
mime_guess = "2.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "time"] }
clap = { version = "4.5", features = ["derive", "env"] }
secrecy = "0.10"
percent-encoding = "2.3"
url = "2.5"
walkdir = "2.5"
regex = "1.11"
